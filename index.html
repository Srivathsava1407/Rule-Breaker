<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rule Breaker</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rancho&effect=shadow-multiple">
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
        <link rel="stylesheet" href="styles.css">
        
    </head>
    <body>

        <!-- Animated Chibi Background -->
        <section class="bg-pattern" aria-hidden="true"></section>

        <header>
            <h1 class="my-heading font-effect-shadow-multiple">Rule Breaker</h1>
            <p>Welcome to Rule Breaker! This is a simple web application that allows you to break the rules of traditional programming.</p>
        </header>

        <!-- The difficulty selection button -->
        <section class="dropdown">
            <button id="difficulty">Difficulty</button>
            <div class="content">
                <button id="Easy">Easy</button>
                <button id="Medium">Medium</button>
                <button id="Hard">Hard</button>
            </div>
        </section>

        <!-- The start button -->
        <button id="start-button" class="btn-primary" type="button">Start</button>
        <p id="game-rule">Press Start to begin</p>

        <!--section for projecting objects 
            The objects should possess variable color, size, shape and number-->
        <div class="objects" id="objects" hidden></div>

        <p id="game-message" role="status" aria-live="polite">Choose an object.</p>

        <!-- section for displaying lives -->
        <div class="lives" id="lives" hidden>
            <p id="hearts"></p>
        </div>

        <!-- section for diplaying last played objects -->
        <section class="history" id="history" hidden>
            <p>History</p>
            <div id="correct-history-objects"></div>
            <div id="wrong-history-objects"></div>
        </section>


        <dialog id="modal-credits" class="chibi-modal">
            <div class="modal-content">
                <h2>References & Credits</h2>
                <p>Game created with PyScript and Python.</p>
                <ul>
                    <li>Assets & Icons: []</li>
                    <li>Inspirations: []</li>
                </ul>
                <!-- Native form method="dialog" automatically closes the modal on click! -->
                <form method="dialog">
                    <button class="btn-secondary">Close</button>
                </form>
            </div>
        </dialog>


        <footer>
            <section>
                <!-- Hamster Image -->
                <img src="hamster_images/hamster_sweet.webp" alt="A cheerful, round hamster with tan and cream fur, dark eyes, and a wide smile. It sits upright with tiny paws near its chest, facing forward in a friendly cartoon style. The background is plain black, creating a simple, playful scene. The overall emotional tone is warm, happy, and welcoming." id="hamster_sweet">
            </section>

            <section>
            <button id="btn-credits" class="btn-icon" py-click="open_credits_modal">ℹ️</button>
            </section>
        </footer>

        <script type="py" src="main.py" config="./pyscript.json"></script>
    </body>
</html>
